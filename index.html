
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">YOUR PERSONAL PLANNER</p>
      <h1>My To-Do List <span>✦</span></h1>
      <p class="subtitle">Small steps make big progress.</p>
    </header>

    <form id="task-form" class="task-form">
      <input
        type="text"
        id="task-input"
        placeholder="What needs to get done?"
        maxlength="200"
        autocomplete="off"
        aria-label="New task"
        required
      >
      <button type="submit" id="submit-button">+ Add Task</button>
    </form>

    <p id="message" class="message" role="status"></p>

    <section class="task-section">
      <div class="section-heading">
        <h2>Your tasks</h2>
        <span id="task-count" class="count">0 tasks left</span>
      </div>

      <nav class="filters" aria-label="Filter tasks">
        <button type="button" class="filter active" data-filter="all">
          All
        </button>
        <button type="button" class="filter" data-filter="active">
          Active
        </button>
        <button type="button" class="filter" data-filter="completed">
          Completed
        </button>
      </nav>

      <ul id="task-list" class="task-list"></ul>

      <div id="empty-state" class="empty-state">
        <div class="empty-icon">✧</div>
        <h3>No tasks here yet</h3>
        <p>Add a task above to get started.</p>
      </div>

      <footer class="footer">
        <span id="total-count">0 total tasks</span>
        <button type="button" id="clear-completed" class="clear-button">
          Clear completed
        </button>
      </footer>
    </section>
  </main>
</body>
</html>
